<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>machi-diff — 世田谷区 2023→2025</title>
    <style>
      /* レイアウトの基礎は JS 注入の CSS を待たずに効かせる。
         待つと地図の生成時にコンテナの高さが 0 になり、
         canvas が MapLibre のフォールバック 400x300 に固定される */
      html, body { margin: 0; height: 100%; }
      #map { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <button id="panel-toggle" type="button" aria-label="サイドバーの開閉">
      <span></span>
    </button>
    <aside id="panel">
      <div id="search">
        <p class="group-label">町名で探す</p>
        <input id="q" type="search" placeholder="例: 世田谷一丁目"
               autocomplete="off" spellcheck="false">
        <ul id="suggest" hidden></ul>
      </div>

      <section id="years">
        <p class="group-label">年度</p>
        <div class="seg">
          <label><input type="radio" name="year" value="2023"><span>2023</span></label>
          <label><input type="radio" name="year" value="2025" checked><span>2025</span></label>
        </div>
      </section>

      <section>
        <p class="group-label">見え方</p>
        <div class="seg" id="mode">
          <label><input type="radio" name="view" value="2d" checked><span>平面</span></label>
          <label><input type="radio" name="view" value="3d"><span>3D</span></label>
        </div>
      </section>

      <section id="basemaps">
        <p class="group-label">背景</p>
        <div class="seg">
          <label><input type="radio" name="bm" value="pale" checked><span>地図</span></label>
          <label><input type="radio" name="bm" value="photo"><span>写真</span></label>
          <label><input type="radio" name="bm" value="none"><span>なし</span></label>
        </div>
      </section>

      <section>
        <p class="group-label">表示形式</p>
        <div class="seg" id="palette">
          <label><input type="radio" name="pal" value="change" checked><span>街の変化</span></label>
          <label><input type="radio" name="pal" value="usage"><span>建物の用途</span></label>
        </div>
        <div id="filters"></div>
      </section>

      <details id="about">
        <summary>この地図について</summary>
        <p>
          PLATEAU の 2023年度版と 2025年度版を重ね、建物の輪郭が
          消えた・あらわれた・形が変わった場所を拾っています。
          元データに解体や着工の記録は無いので、
          そこで何が起きたかまでは分かりません。
        </p>
      </details>
    </aside>

    <div id="here" hidden>
      <span class="name"></span>
      <span class="meta"></span>
    </div>

    <details id="legend">
      <summary>凡例</summary>
      <div id="legend-body"></div>
    </details>

    <details id="ranking">
      <summary>変化率ランキング</summary>
      <p class="sub">町丁目別・総建物数300棟以上</p>
      <ol id="rank-list"></ol>
    </details>

    <div id="detail" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
